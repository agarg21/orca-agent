name: Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "tests/**"
      - "npm/orca/**"
      - "install.ps1"
      - "scripts/release/**"
      - "scripts/validate-runtime-surface-contract.mjs"
      - "scripts/test-validate-runtime-surface-contract.mjs"
      - "scripts/validate-execution-broker-boundary.mjs"
      - "scripts/test-validate-execution-broker-boundary.mjs"
      - "scripts/validate-windows-platform-boundaries.mjs"
      - "scripts/test-validate-windows-platform-boundaries.mjs"
      - "docs/superpowers/specs/2026-07-28-native-windows-platform-foundation.manifest.json"
      - ".config/nextest.toml"
      - ".gitattributes"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "tests/**"
      - "npm/orca/**"
      - "install.ps1"
      - "scripts/release/**"
      - "scripts/validate-runtime-surface-contract.mjs"
      - "scripts/test-validate-runtime-surface-contract.mjs"
      - "scripts/validate-execution-broker-boundary.mjs"
      - "scripts/test-validate-execution-broker-boundary.mjs"
      - "scripts/validate-windows-platform-boundaries.mjs"
      - "scripts/test-validate-windows-platform-boundaries.mjs"
      - "docs/superpowers/specs/2026-07-28-native-windows-platform-foundation.manifest.json"
      - ".config/nextest.toml"
      - ".gitattributes"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

jobs:
  native-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@4dc1969decfa71b34f25aa7f3dd4656654d9ad1e # nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate reviewed platform boundaries
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/test-validate-runtime-surface-contract.mjs
          node scripts/validate-runtime-surface-contract.mjs
          node scripts/test-validate-windows-platform-boundaries.mjs
          node scripts/validate-windows-platform-boundaries.mjs
          node scripts/test-validate-execution-broker-boundary.mjs
          node scripts/validate-execution-broker-boundary.mjs
      - name: Check the full workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build the Windows async subagent runner
        run: cargo build -p orca-windows-runner --locked
      - name: Run resource-sensitive Windows contracts
        env:
          RUST_BACKTRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo nextest run --workspace --all-targets --locked --profile ci --no-fail-fast --retries 0 -E 'binary(=task_output_store) | binary(=subagent_recovery_contract) | binary(=subagent_contract) | binary(=session_server_contract) | test(/^acp::supervisor::tests::/)'
      - name: Run the full Windows test suite
        timeout-minutes: 75
        env:
          RUST_BACKTRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo nextest run -p orca-tui --lib --locked --profile ci-serial --retries 0
          cargo nextest run --test tui_pty_contract --locked --profile ci-serial --no-tests=pass --retries 0
          cargo nextest run --workspace --all-targets --locked --profile ci --no-fail-fast --retries 0 -E 'not (binary(=task_output_store) | binary(=subagent_recovery_contract) | binary(=subagent_contract) | binary(=session_server_contract) | test(/^acp::supervisor::tests::/))'

  native-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: taiki-e/install-action@4dc1969decfa71b34f25aa7f3dd4656654d9ad1e # nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-arm64-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate reviewed platform boundaries
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/test-validate-runtime-surface-contract.mjs
          node scripts/validate-runtime-surface-contract.mjs
          node scripts/test-validate-windows-platform-boundaries.mjs
          node scripts/validate-windows-platform-boundaries.mjs
      - name: Check the native ARM64 workspace
        run: cargo check --workspace --all-targets --locked
      - name: Build and start the native ARM64 binary
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked
          & "./target/release/orca.exe" --version
      - name: Build the native ARM64 async subagent runner
        run: cargo build -p orca-windows-runner --locked
      - name: Run resource-sensitive native ARM64 contracts
        env:
          RUST_BACKTRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo nextest run --workspace --all-targets --locked --profile ci --no-fail-fast --retries 0 -E 'binary(=task_output_store) | binary(=subagent_recovery_contract) | binary(=subagent_contract) | binary(=session_server_contract) | test(/^acp::supervisor::tests::/)'
      - name: Run the full native ARM64 test suite
        timeout-minutes: 75
        env:
          RUST_BACKTRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo nextest run -p orca-tui --lib --locked --profile ci-serial --retries 0
          cargo nextest run --test tui_pty_contract --locked --profile ci-serial --no-tests=pass --retries 0
          cargo nextest run --workspace --all-targets --locked --profile ci --no-fail-fast --retries 0 -E 'not (binary(=task_output_store) | binary(=subagent_recovery_contract) | binary(=subagent_contract) | binary(=session_server_contract) | test(/^acp::supervisor::tests::/))'
